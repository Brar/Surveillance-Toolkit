project:
  output-dir: _output
date-meta: now
echo: false
engine: knitr
filters: ["../filters/pandoc-quotes.lua"]
format:
  html:
    link-external-icon: true
    link-external-newwindow: true
  pdf:
    documentclass: article
    # LuaLaTeX pinned: `pdf-standard` reaches LaTeX as \DocumentMetadata, which
    # needs LuaLaTeX. Pinning it here keeps every render path on one engine.
    pdf-engine: lualatex
    # ua-2 declared alongside archival a-4: ua-2 requires tagged structure, which
    # Quarto turns on with tagging=on for it. The article class is recorded as
    # compatible with LaTeX tagging in the LaTeX Tagging Project's status table
    # (https://latex3.github.io/tagging-project/tagging-status/), as are the
    # packages named in this configuration; scripts/Test-ReportPdfTagging.ps1
    # checks a rendered file's structure tree against the declaration. A package
    # that table records as incompatible — textpos, in the Partner Certificate —
    # keeps ua-2 out of the report that loads it.
    pdf-standard: [a-4, ua-2]
    mainfont: "Noto Sans"
    monofont: "Noto Sans"
    fontsize: 10pt
    papersize: a4
    fig-pos: 'H'
    colorlinks: true
    geometry:
      - top=25mm
      - bottom=25mm
      - left=25mm
      - right=25mm
      - heightrounded
    include-in-header:
      text: |
        \usepackage{float}
        \usepackage{placeins}
        \floatplacement{figure}{H}
        \usepackage{graphicx}
        \usepackage{fancyhdr}
        \pagestyle{fancy}
        \fancyhf{}
        \fancyhead[L]{\includegraphics[width=4cm]{../logos/LOGO_NEOIPC_2.png}}
        \fancyfoot[R]{\thepage}
        % The 4 cm header logo is 50 pt tall, and \headheight below it makes
        % fancyhdr warn and clip the image.
        \setlength{\headheight}{51pt}
        % The reports carry a rule above the footer on every page including the
        % title page: \footrulewidth draws it on both page styles, and the plain
        % (title) page carries the same outer page number and no header.
        \renewcommand{\footrulewidth}{0.4pt}
        \renewcommand{\headrule}{}
        \fancypagestyle{plain}{%
          \fancyhf{}
          \fancyfoot[R]{\thepage}
        }
profile:
  group:
    - [en, de]
